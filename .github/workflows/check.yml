name: マンガ更新チェック

on:
  schedule:
    # JST 12:15 / 18:15 / 24:15 （GigaViewer の更新は JST 12:00 が多い）
    # GitHub の cron は混雑時に数分〜十数分遅れることがある
    - cron: '15 3,9,15 * * *'
  workflow_dispatch:
    inputs:
      test_post:
        description: '新着が無くても最新1話を投稿する（疎通確認用）'
        type: boolean
        default: false

# seen.json をコミットして push するために必要
permissions:
  contents: write

# 手動実行とスケジュールが重なっても二重投稿しないようにする
concurrency:
  group: comic-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 更新チェックと通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_POST: ${{ inputs.test_post && '1' || '0' }}
        run: python check.py

      # 途中で失敗しても、そこまでの既読と失敗状態は残す
      - name: 既読状態を保存
        if: always()
        run: |
          if [ -z "$(git status --porcelain seen.json)" ]; then
            echo "変更なし。コミットをスキップする"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add seen.json
          git commit -m 'chore: 既読状態を更新'
          # 実行が重なった場合に備えてリトライしながら push する
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push に失敗（$attempt/3）。rebase して再試行する"
            git pull --rebase --autostash
            sleep 3
          done
          exit 1

      # check.py が異常終了した場合や push に失敗した場合は、スクリプトからは
      # 通知が出せない。ログを見なくても気づけるよう、ここで拾って通知する。
      - name: ワークフローの失敗を通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          payload = {
              "username": "マンガ更新",
              "content": "🚨 **更新チェックの処理自体が失敗しました**",
              "embeds": [{
                  "title": "実行ログを開く",
                  "url": os.environ["RUN_URL"],
                  "description": (
                      "スクリプトの異常終了、または既読状態の保存に失敗した。\n"
                      "**更新を見逃している可能性があるので確認を。**"
                  ),
                  "color": 0xE74C3C,
              }],
              "allowed_mentions": {"parse": []},
          }
          request = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
          )
          urllib.request.urlopen(request, timeout=30)
          PY
